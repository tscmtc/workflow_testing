name: Echo Secrets Test

on:
  push:
    branches:
    - main
    - prod
    
jobs:
  echo-secrets:
    runs-on: ubuntu-latest
    steps:  
      - name: Echo Keys
        run: |
          echo "${{ github.ref_name }}"
          echo "${{ secrets[github.ref_name + 'DEPLOY_KEY'] }}"
          echo "${{ secrets.HOST_NAME }}"
